name: Demo Terraform answer

on:
  pull_request:
    paths:
      - 'examples/terraform/**'
      - 'docs/terraform-review-guidance.md'
      - '.github/workflows/demo-terraform-scan.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comment with agentic security report
        uses: ./
        with:
          prompt: |
            Perform a Terraform governance security review of the changed files using the repository governance docs as the source of truth.
            Prioritize public exposure, missing ownership metadata, hardcoded secrets, and operational safeguards.
            If the changed file references shared locals, modules, variables, or stateful resources, request the exact Terraform file you need before finalizing the review.
            Return a concise report with a verdict, findings, and next steps that can be posted as a PR comment.
          context: |
            This is the agentic-runner Terraform governance demo.
            The rules live in docs/terraform-review-guidance.md.
            Review the changed Terraform files first and use additional file requests only when necessary.
          context_mode: agentic
          focus_paths: |
            examples/terraform/main.tf
          extra_context_paths: |
            docs/terraform-review-guidance.md
            examples/terraform/locals.tf
            examples/terraform/stateful.tf
          llm_base_url: ${{ secrets.BIFROST_ENDPOINT }}
          llm_api_key: ${{ secrets.BIFROST_VIRTUAL_KEY }}
          github_token: ${{ github.token }}
          pr_number: ${{ github.event.pull_request.number }}
          post_comment: true
          fail_on_findings: false
