name: Demo Terraform scan

on:
  pull_request:
    paths:
      - 'examples/terraform/**'
      - 'docs/terraform-review-guidance.md'
      - '.github/workflows/demo-terraform-scan.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comment with findings
        uses: ./
        with:
          prompt: |
            Scan the example Terraform in this pull request and return a concise report of findings.
            Focus on real infrastructure risks, drift, and missing ownership or governance metadata.
            Do not invent issues that are not present in the Terraform files.
          context: |
            This is the agentic-runner demo workflow.
            The repository includes a deliberate Terraform example change for the workflow to inspect.
          context_mode: diff
          focus_paths: |
            examples/terraform/main.tf
          extra_context_paths: |
            docs/terraform-review-guidance.md
          llm_base_url: ${{ secrets.BIFROST_ENDPOINT }}
          llm_api_key: ${{ secrets.BIFROST_VIRTUAL_KEY }}
          github_token: ${{ github.token }}
          pr_number: ${{ github.event.pull_request.number }}
          post_comment: true
          fail_on_findings: false
