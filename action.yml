name: agentic-runner
description: Call an OpenAI-compatible LLM with injected context, render a concise PR comment, and optionally upsert it as a PR comment.

inputs:
  prompt:
    description: Primary instruction for the LLM workflow.
    required: true
  context:
    description: Optional injected context to include with the prompt.
    required: false
    default: ""
  llm_base_url:
    description: OpenAI-compatible LLM base URL. The action normalizes root and `/v1` endpoints to chat completions.
    required: false
    default: ""
  llm_api_key:
    description: OpenAI-compatible LLM API key.
    required: false
    default: ""
  github_token:
    description: GitHub token used to upsert PR comments.
    required: false
    default: ${{ github.token }}
  model:
    description: Model name to use.
    required: false
    default: openai/gpt-4o-mini
  pr_number:
    description: Pull request number to comment on. Defaults to the current PR context when available.
    required: false
    default: ""
  post_comment:
    description: Whether to upsert a PR comment.
    required: false
    default: "true"
  fail_on_findings:
    description: Fail the step when the generated response signals attention or blocking issues.
    required: false
    default: "false"
  comment_marker:
    description: Stable HTML marker used to update one comment instead of creating duplicates.
    required: false
    default: "<!-- agentic-runner -->"
  dry_run:
    description: Skip posting a PR comment and only emit outputs.
    required: false
    default: "false"
  mock_response_file:
    description: Optional path to a file containing a raw JSON response payload for tests and local validation.
    required: false
    default: ""
  context_mode:
    description: Context strategy to use. diff, full, hybrid, or agentic.
    required: false
    default: diff
  focus_paths:
    description: Comma or newline separated list of files to focus the scan on.
    required: false
    default: ""
  extra_context_paths:
    description: Comma or newline separated list of file paths to always include.
    required: false
    default: ""
  max_file_chars:
    description: Maximum characters to load per file.
    required: false
    default: "12000"
  max_follow_up_rounds:
    description: Maximum number of additional file-request rounds in agentic mode.
    required: false
    default: "1"

outputs:
  signal:
    description: Signal from the model response.
  answer:
    description: Direct answer text rendered into the comment.
  comment_body:
    description: Rendered Markdown comment body.
  comment_url:
    description: URL of the upserted PR comment, if any.

runs:
  using: node24
  main: dist/index.js
